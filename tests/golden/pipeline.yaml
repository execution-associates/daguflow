# Generated by daguflow from examples/features.py (dagu v2.24.0). Edit the Python, not this file.
#
# The body reads like Airflow TaskFlow: outputs passed as arguments
# become dependencies on their own.
description: Python tasks passing JSON, a parallel sub-DAG fan-out, an inline loop and handlers.
labels:
  - examples
schedule: CRON_TZ=America/Los_Angeles 0 6 * * 1-5
params:
  - name: count
    type: integer
    default: 3
    minimum: 1
    maximum: 20
  - name: mode
    type: string
    default: fast
    enum:
      - fast
      - slow
timeout_sec: 600
max_active_steps: 4
steps:
  - name: make_items
    run: echo  | base64 -d | python3 -
    output: MAKE_ITEMS
  - name: total
    depends: make_items
    run: echo  | base64 -d | python3 -
    env:
      - DAGUFLOW_ARG_items: ${MAKE_ITEMS}
    output: TOTAL
  - name: describe
    depends: total
    run: echo  | base64 -d | python3 -
    env:
      - DAGUFLOW_ARG_summary: ${TOTAL}
    output: DESCRIBE
  - name: square
    depends: make_items
    action: dag.run
    with:
      dag: square
    parallel:
      items: ${MAKE_ITEMS}
      max_concurrent: 2
  - name: colors
    foreach:
      items:
        - red
        - green
      as: color
      max_concurrent: 2
      steps:
        - name: paint
          run: echo  | base64 -d | python3 -
          env:
            - DAGUFLOW_ARG_color: ${foreach.color}
          output: PAINT
  - name: check
    preconditions:
      - condition: ${mode}
        expected: re:fast|slow
    run: test -n "$HOME" && echo ok
    retry_policy:
      limit: 2
      interval_sec: 5
  - name: tolerant
    depends: check
    run: exit 3
    continue_on:
      exit_code:
        - 3
handler_on:
  failure:
    name: alert
    run: echo failed >&2
  exit:
    name: cleanup
    run: echo run ${context.run.id} finished
---
name: square
params:
  - n: '0'
  - label: ''
steps:
  - name: square_of
    run: echo  | base64 -d | python3 -
    env:
      - DAGUFLOW_ARG_n: ${n}
    output: SQUARE_OF
