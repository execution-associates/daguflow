# Generated by daguflow from examples/home.py (dagu v2.24.0). Edit the Python, not this file.
description: When tonight's lights should come up, and how warm the Pi is
labels:
  - lights
  - schedule
schedule: CRON_TZ=America/Los_Angeles 0 6 * * *
params:
  - name: minutes_before
    type: integer
    default: 30
    minimum: 0
    maximum: 120
steps:
  - name: sunset_trigger
    run: echo  | base64 -d | python3 -
    env:
      - DAGUFLOW_ARG_minutes_before: ${minutes_before}
    output: SUNSET_TRIGGER
  - name: pi_temperature
    action: ssh.run
    with:
      user: ${env.PI_USER}
      host: 192.168.1.50
      key: /etc/dagu/ssh/id_ed25519
      strict_host_key: true
      known_host_file: /etc/dagu/ssh/known_hosts
      command: /usr/bin/python3 -c "$(echo  | base64 -d)"
    output: PI_TEMPERATURE
