description: Set every Nanoleaf light to a named effect
labels:
  - lights
  - shortcut
params:
  - effect: ''
env:
  - PI_USER: ${HOME_PI_USER}
  - PI_ROOT: ${HOME_PI_ROOT}
steps:
  - name: set-effect
    action: ssh.run
    with:
      user: ${env.PI_USER}
      host: 192.168.1.50
      port: 22
      key: /etc/dagu/ssh/id_ed25519
      strict_host_key: true
      known_host_file: /etc/dagu/ssh/known_hosts
      command: /usr/bin/python3 ${env.PI_ROOT}/lights.py effect --name "${effect}"
    output: RESULT
