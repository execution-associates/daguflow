# Generated by daguflow from examples/home.py (dagu v2.24.0). Edit the Python, not this file.
description: Good Vibes at 50% on every light, 30 minutes before sunset
labels:
  - lights
  - schedule
schedule: CRON_TZ=America/Los_Angeles * 15-22 * * *
params:
  - brightness: 50
  - minutes_before: 30
env:
  - PI_USER: ${HOME_PI_USER}
  - PI_ROOT: ${HOME_PI_ROOT}
timeout_sec: 300
steps:
  - name: sunset-check
    action: ssh.run
    with:
      user: ${env.PI_USER}
      host: 192.168.1.50
      port: 22
      key: /etc/dagu/ssh/id_ed25519
      strict_host_key: true
      known_host_file: /etc/dagu/ssh/known_hosts
      command: /usr/bin/python3 ${env.PI_ROOT}/lights.py sunset --brightness $brightness --minutes-before $minutes_before
    output: RESULT
