description: One child run per light, four at a time
labels:
  - lights
params:
  - name: mode
    type: string
    default: warm
    enum:
      - warm
      - cool
  - name: level
    type: integer
    default: 30
    minimum: 0
    maximum: 100
  - name: label
    type: string
    default: ''
    pattern: ^[A-Za-z ]*$
env:
  - PI_USER: ${HOME_PI_USER}
  - PI_ROOT: ${HOME_PI_ROOT}
steps:
  - name: list_lights
    action: ssh.run
    with:
      user: ${env.PI_USER}
      host: 192.168.1.50
      port: 22
      key: /etc/dagu/ssh/id_ed25519
      strict_host_key: true
      known_host_file: /etc/dagu/ssh/known_hosts
      command: /usr/bin/python3 ${env.PI_ROOT}/lights.py list --json
    output: LIST_LIGHTS
  - name: apply
    depends: list_lights
    action: dag.run
    with:
      dag: apply
      params:
        light: ${ITEM}
    parallel:
      items: ${LIST_LIGHTS.names}
      max_concurrent: 4
  - name: summarize
    depends:
      - list_lights
      - apply
    action: ssh.run
    with:
      user: ${env.PI_USER}
      host: 192.168.1.50
      port: 22
      key: /etc/dagu/ssh/id_ed25519
      strict_host_key: true
      known_host_file: /etc/dagu/ssh/known_hosts
      command: |-
        /usr/bin/python3 -c "$(echo  | base64 -d)" 3<<'DAGUFLOW_EOF'
        ${LIST_LIGHTS}
        DAGUFLOW_EOF
    output: SUMMARIZE
  - name: foreach
    foreach:
      items:
        - a
        - b
      as: room
      max_concurrent: 2
      steps:
        - name: say
          run: echo ${foreach.room}
handler_on:
  failure:
    name: notify
    run: echo failed
---
name: apply
params:
  - light: ''
env:
  - PI_USER: ${HOME_PI_USER}
  - PI_ROOT: ${HOME_PI_ROOT}
steps:
  - name: set_effect
    action: ssh.run
